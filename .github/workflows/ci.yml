name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PHP SQLite extension
        run: sudo apt-get update && sudo apt-get install -y php-sqlite3
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: PHP syntax
        run: find backend -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Backend tests
        run: php backend/tests/run.php
      - name: Frontend tests
        working-directory: frontend
        run: node --test tests/*.test.mjs
