name: CI

on:
  push:
  pull_request:

jobs:
  unit-and-race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install PHP SQLite extension
        run: sudo apt-get update && sudo apt-get install -y php-sqlite3
      - name: Install frontend dependencies reproducibly
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: PHP syntax
        run: find backend -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Backend tests and fuzz checks
        run: php backend/tests/run.php
      - name: Burn-after-reveal race test
        run: php backend/tests/concurrency.php
      - name: Frontend crypto/property tests
        working-directory: frontend
        run: node --test tests/*.test.mjs

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PHP SQLite extension
        run: sudo apt-get update && sudo apt-get install -y php-sqlite3
      - name: Build frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Install Playwright 1.62.0
        run: pip install 'playwright==1.62.0'
      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium firefox webkit
      - name: Cross-browser E2E and accessibility smoke tests
        run: python tests/e2e/test_echo.py
